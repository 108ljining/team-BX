<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 사무실 3D</title>
<style>
:root{--bg:#2b2d2a;--ink:#f2efe6;--panel:#3a3d38;--accent:#6fa37f;--warn:#e0a64a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;text-align:center;font-size:12px;font-weight:700}
.tag .bubble{display:none;background:rgba(58,61,56,.92);color:#f2efe6;border:1px solid #6b7064;border-radius:8px;padding:2px 8px;margin:0 auto 3px;width:max-content;max-width:160px;font-size:11px;font-weight:600}
.tag .chat{display:none;position:relative;background:#fff;color:#1d1f1b;border-radius:12px;padding:5px 10px;margin:0 auto 9px;width:max-content;max-width:180px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:pop .18s ease-out}
.tag .chat::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#chat{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px}
#chatLog{max-height:170px;overflow-y:auto;background:rgba(43,45,42,.8);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;word-break:break-all}
#chatLog:empty{display:none}
#chatLog .who{font-weight:700;color:#cfe3cf;margin-right:6px}
#chatLog .mine .who{color:#f2d98a}
#chatIn{width:100%;background:rgba(43,45,42,.92)}
@media(max-width:900px){#chat{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}#chatLog{max-height:110px}}
.tag .lc{display:none;background:#cfe3cf;color:#1d1f1b;border-radius:10px;padding:2px 8px;margin:0 auto 3px;width:max-content}
.tag .nm{background:#f2efe6;color:#1d1f1b;border-radius:10px;padding:2px 8px;margin:0 auto;width:max-content}
.tag.me .nm{background:#f2d98a}
#ui{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100% - 20px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:rgba(43,45,42,.9);padding:8px 12px;border-radius:12px;font-size:14px}
#hint{font-size:12px;opacity:.65}
#msgIn{width:min(260px,52vw)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid #55594f;border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #55594f;background:#2b2d2a;color:var(--ink)}
#join{position:fixed;inset:0;background:rgba(30,32,28,.94);display:flex;align-items:center;justify-content:center;padding:20px}
#join div{background:var(--panel);padding:28px;border-radius:12px;width:min(360px,100%)}
#join h1{font-size:20px;margin:0 0 6px}
#join p{margin:0 0 16px;font-size:14px;opacity:.75}
#join input{width:100%;margin-bottom:12px;padding:10px}
#join button{width:100%;background:var(--accent);color:#17231b;border:0;font-weight:700}
#err{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}
input[type=color]{width:44px;height:36px;padding:2px;cursor:pointer}
.hue{-webkit-appearance:none;appearance:none;width:110px;height:14px;padding:0;border:0;border-radius:7px;background:linear-gradient(90deg,hsl(0 75% 50%),hsl(60 75% 50%),hsl(120 75% 50%),hsl(180 75% 50%),hsl(240 75% 50%),hsl(300 75% 50%),hsl(360 75% 50%))}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #333;cursor:pointer}
.hue::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #333;cursor:pointer}
#stylePanel{flex-direction:column;align-items:stretch;gap:10px;width:min(640px,calc(100vw - 24px));max-height:min(62vh,440px);overflow-y:auto}
.pair{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:10px;background:rgba(255,255,255,.04)}
.sw{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid #55594f}
.sw.on{border-color:#f2efe6}
#chatLog .sys{color:var(--warn);font-size:12px}
.grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.lbl{font-size:12px;opacity:.75;min-width:30px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{padding:6px 10px;font-size:13px}
.chip.on{border-color:var(--accent);background:#4a5a4d}
.pow{position:fixed;left:0;top:0;pointer-events:none;font-weight:900;font-size:28px;color:#ffd84a;-webkit-text-stroke:1px #7a3b00;text-shadow:0 2px 0 #7a3b00;animation:pow .7s ease-out forwards}
@keyframes pow{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-220%) scale(1.5)}}
@media(max-width:600px){#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="ui">
  <div class="row" id="lunchPanel" hidden>
    <button data-lunch="안에서 🍱">안에서 🍱</button>
    <button data-lunch="밖에서 🍜">밖에서 🍜</button>
    <button data-lunch="">선택 지우기</button>
  </div>
  <div class="row" id="stylePanel" hidden>
    <div class="sec">
      <div class="grp"><span class="lbl">옷</span><span class="chips" id="outfitGroup"></span></div>
      <div class="grp">
        <span class="pair"><span class="lbl">상의</span><input type="color" id="topIn" aria-label="상의 색"><input type="range" class="hue" id="topHue" min="0" max="360" aria-label="상의 색상 스펙트럼"></span>
        <span class="pair"><span class="lbl">하의</span><input type="color" id="botIn" aria-label="하의 색"><input type="range" class="hue" id="botHue" min="0" max="360" aria-label="하의 색상 스펙트럼"></span>
      </div>
    </div>
    <div class="sec">
      <div class="grp"><span class="lbl">머리</span><span class="chips" id="hairGroup"></span></div>
      <div class="grp"><span class="pair"><span class="lbl">머리색</span><input type="color" id="hairIn" aria-label="머리 색"><input type="range" class="hue" id="hairHue" min="0" max="360" aria-label="머리 색상 스펙트럼"></span><span class="chips" id="hairSw"></span></div>
    </div>
    <div class="grp"><input id="nameIn" maxlength="8" placeholder="닉네임 (8자)" autocomplete="off" size="9"><button id="nameOk">이름 바꾸기</button><button id="lookReset">기본값</button></div>
  </div>
  <div class="row" id="msgRow">
    <input id="msgIn" maxlength="24" placeholder="📌 상태메세지 (계속 표시, 24자)" autocomplete="off" size="24">
    <button id="msgOk">설정</button>
    <button id="msgClear">지우기</button>
  </div>
  <div class="row">
    <button id="sit">앉기·눕기 / 일어나기</button>
    <button id="lunchBtn">점심</button>
    <button id="styleBtn">꾸미기</button>
    <button id="viewBtn" title="시점 처음으로" aria-label="시점 초기화">🎥</button>
    <button id="muteBtn" title="효과음 켜기/끄기" aria-label="효과음">🔊</button>
    <button id="hitBtn" hidden>🥊 때리기 (F)</button>
    <span id="count"></span>
    <span id="hint">방향키·WASD 이동 · 바닥 클릭 이동 · Space 앉기·눕기 · 공룡 앞에서 F · Enter 채팅 · 드래그로 시점 회전</span>
  </div>
</div>
<div id="chat" hidden>
  <div id="chatLog" aria-live="polite"></div>
  <input id="chatIn" maxlength="60" placeholder="💬 채팅 입력 후 Enter" autocomplete="off">
</div>
<div id="join"><div>
  <h1>우리 사무실</h1>
  <p>닉네임을 정하고 들어오세요. (최대 12명)</p>
  <input id="nick" maxlength="8" placeholder="닉네임 (8자 이내)" autocomplete="off">
  <button id="go">입장</button>
  <div id="err"></div>
</div></div>

<script src="firebase-config.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ====== Firebase Realtime Database 정보를 넣으면 다른 기기와도 동시접속됩니다.
   설정은 firebase-config.js 파일에 넣습니다. 비워 두면 같은 브라우저의 다른 탭끼리만 테스트용으로 연결됩니다. ====== */
const _c = window.FIREBASE_CONFIG;
const FIREBASE_CONFIG = (_c && _c.databaseURL && !String(_c.databaseURL).includes('여기에')) ? _c : null;
const MAX = 12, STALE = 15000;
const $ = id => document.getElementById(id);

/* ---------- 3D 장면 ---------- */
const renderer = new THREE.WebGLRenderer({canvas:$('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2d2a);
const camera = new THREE.PerspectiveCamera(42, 1, .1, 100);
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8a8678, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(6, 14, 8); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera, {left:-16, right:16, top:12, bottom:-12, near:1, far:40});
scene.add(sun);

const M = (c, o={}) => new THREE.MeshStandardMaterial({color:c, roughness:.85, ...o});
function box(w,h,d,mat,x,y,z,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(26,18), M(0xd0cbba));
floor.rotation.x = -Math.PI/2; floor.position.z = 1; floor.receiveShadow = true; scene.add(floor);
const wallM = M(0xe8e4d6);
const wallsBack = [box(26,5,.4,wallM,0,2.5,-8)], wallL = box(.4,5,18,wallM,-13,2.5,1), wallR = box(.4,5,18,wallM,13,2.5,1), wallF = box(26,5,.4,wallM,0,2.5,10.2);
wallF.castShadow = false;
wallsBack.push(box(26,.25,.45,M(0xb9b5a3),0,.12,-7.8));
for(const x of [-6,6]) wallsBack.push(box(4,2,.1,M(0xa8d0e4,{emissive:0x5a8aa0,emissiveIntensity:.5}),x,3,-7.78));
const OZ = 4;                                 // 사무공간을 맵 가운데로 옮기는 값
box(9,.03,5.2,M(0x8fa89a),0,.015,-3+OZ);       // 책상 구역 러그

/* 책상 6개: 3개 + 3개, 의자 등을 맞대고 앉음 */
/* 모니터 화면: 앉으면 켜지며 흰 바탕에 랜덤 문구 */
const SCREEN_MSGS = ['집갈래','졸려','일하기싫어'];
const screens = [];
function makeScreen(i, x, z, flip){
  const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 150;
  const tex = new THREE.CanvasTexture(canvas), mat = new THREE.MeshBasicMaterial({map:tex});
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.05,.6), mat);
  m.position.set(x,1.95,z); if(flip) m.rotation.y = Math.PI; scene.add(m);
  screens[i] = {canvas, tex, mat, state:-1, fade:1}; drawScreen(i,-1);
}
function drawScreen(i, idx){
  const sc = screens[i], c = sc.canvas.getContext('2d'), w = 256, h = 150;
  if(idx < 0){ c.fillStyle = '#1c2227'; c.fillRect(0,0,w,h); }
  else {
    c.fillStyle = '#fff'; c.fillRect(0,0,w,h); c.fillStyle = '#e4e6e8'; c.fillRect(0,0,w,20);
    ['#ff6b5f','#ffc04a','#3fcf5a'].forEach((col,k) => { c.fillStyle = col; c.beginPath(); c.arc(14+k*16,10,5,0,7); c.fill(); });
    c.fillStyle = '#222'; c.font = 'bold 42px "Noto Sans KR", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(SCREEN_MSGS[idx % SCREEN_MSGS.length], w/2, 86);
  }
  sc.tex.needsUpdate = true;
}
const SEATS = [];
for(const x of [-6,0,6]){ SEATS.push({x, z:-3.8+OZ, r:Math.PI}); SEATS.push({x, z:-2.2+OZ, r:0}); }
const DESKS = [];
const wood = M(0xb58a5d), dark = M(0x3d4a52), gray = M(0x59635f);
SEATS.forEach((s,si) => {
  const f = s.r === 0, Z = z => (f ? -6 - z : z) + OZ;      // 반대편 줄은 z=-3 기준 대칭
  box(3,.15,1.6,wood,s.x,1.2,Z(-5.2)); box(.12,1.2,1.4,wood,s.x-1.4,.6,Z(-5.2)); box(.12,1.2,1.4,wood,s.x+1.4,.6,Z(-5.2));
  box(1.2,.75,.07,dark,s.x,1.95,Z(-5.45)); makeScreen(si, s.x, Z(-5.45) + (f ? -.045 : .045), f); box(.15,.35,.15,gray,s.x,1.4,Z(-5.4)); box(.9,.05,.3,gray,s.x,1.3,Z(-4.8));
  box(.9,.12,.9,gray,s.x,.7,s.z); box(.9,.9,.1,gray,s.x,1.25,s.z + (f?-.45:.45));
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.65), gray); p.position.set(s.x,.35,s.z); scene.add(p);
  const zc = Z(-5.2); DESKS.push({x1:s.x-1.5, x2:s.x+1.5, z1:zc-.8, z2:zc+.8});
});
for(const [x,z] of [[-12,-7],[12,-7],[-12,7],[12,7]]){
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.45,.35,.7,12), M(0x8a6a4f)); pot.position.set(x,.35,z); pot.castShadow = true; scene.add(pot);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(.8,12,10), M(0x4f8a5b)); leaf.position.set(x,1.3,z); leaf.castShadow = true; scene.add(leaf);
}
/* 침대 3개 (공룡 반대편 벽) + 누우면 생기는 링거 */
const BEDS = [-6,0,6].map(x => ({x})), BED_Z0 = 7.3;       // BED_Z0: 누웠을 때 발 위치
const bedWood = M(0x8a6a4f), sheet = M(0xf4f1ea), steel = M(0xc9d0d4,{metalness:.4}), clear = M(0xbfe3f5,{transparent:true,opacity:.7}), fluid = M(0x8ec5e8);
const ivs = [];
BEDS.forEach((b,i) => {
  DESKS.push({x1:b.x-1.1, x2:b.x+1.1, z1:6.2, z2:9.8});
  box(2.2,.3,3.6,bedWood,b.x,.2,8); box(2,.3,3.4,sheet,b.x,.5,8); box(1.3,.34,.9,sheet,b.x,.82,9.15); box(2.2,1.3,.15,bedWood,b.x,.95,9.75);
  const g = new THREE.Group(); g.position.set(b.x+1.45,0,7.9); g.visible = false; scene.add(g);
  mesh(new THREE.CylinderGeometry(.04,.04,3.2,8), steel, 0,1.6,0, g);                 // 폴대
  mesh(new THREE.CylinderGeometry(.36,.4,.08,16), steel, 0,.04,0, g);                 // 받침
  mesh(new THREE.BoxGeometry(.36,.56,.12), clear, 0,2.8,0, g);                        // 수액 봉지
  mesh(new THREE.BoxGeometry(.28,.38,.1), fluid, 0,2.74,0, g);                        // 수액
  mesh(new THREE.CylinderGeometry(.05,.05,.26,8), clear, 0,2.3,0, g);                 // 점적 챔버
  const drop = mesh(new THREE.SphereGeometry(.035,8,6), fluid, 0,2.4,0, g);           // 똑똑 떨어지는 방울
  const a = new THREE.Vector3(0,2.15,0), z = new THREE.Vector3(-1.07,.98,.2), dir = z.clone().sub(a), len = dir.length();
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,1,6), clear);      // 팔로 이어지는 줄
  tube.position.copy(a).add(z).multiplyScalar(.5); tube.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize()); tube.scale.y = len; g.add(tube);
  ivs[i] = {g, drop, k:0};
});
const blocked = (x,z) => DESKS.some(d => x>d.x1-.4 && x<d.x2+.4 && z>d.z1-.4 && z<d.z2+.4) || Math.hypot(x-DINO.x, z-DINO.z) < 2.2;

/* ---------- 사람 (팔·다리 있음) ---------- */
const labelsEl = $('labels');
function hue(id){ let h = 0; for(const c of id) h = (h*31+c.charCodeAt(0))%360; return new THREE.Color().setHSL(h/360,.45,.5); }
const HEX = /^#[0-9a-f]{6}$/i;
const DEFBOT = ['#3b4252','#5b6b8a','#7a6a58','#2f3a46'], DEFHAIR = ['#3a2d25','#222222','#7a4b2a','#b58a5d'];
// 저장된 값이 없거나 이상하면 아이디로 만든 기본 모습을 사용 (모든 접속자 화면에서 같게 보임)
function look(id, s){
  let h = 0; for(const c of id) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const ok = (v,max) => Number.isInteger(v) && v >= 0 && v <= max;
  return {
    outfit: ok(s.outfit,4) ? s.outfit : h%5,
    hair: ok(s.hair,3) ? s.hair : (h>>>3)%4,
    top: HEX.test(s.color||'') ? s.color : '#'+hue(id).getHexString(),
    bot: HEX.test(s.bot||'') ? s.bot : DEFBOT[(h>>>5)%DEFBOT.length],
    hcol: HEX.test(s.hcol||'') ? s.hcol : DEFHAIR[(h>>>7)%DEFHAIR.length]
  };
}
const skinM = M(0xf4d2b2,{roughness:.6}), blackM = new THREE.MeshStandardMaterial({color:0x15110f, roughness:.25}),
  whiteM = M(0xffffff,{roughness:.5}), cheekM = M(0xf7a8ac,{roughness:.8}), shoeM = M(0xe39a50,{roughness:.6}), soleM = M(0xf6f3ee,{roughness:.5});
function mesh(geo, mat, x, y, z, parent){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; parent.add(m); return m; }
const sph = (r,mat,x,y,z,par,sx=1,sy=1,sz=1) => { const m = mesh(new THREE.SphereGeometry(r,20,14), mat, x,y,z, par); m.scale.set(sx,sy,sz); return m; };
const cyl = (rt,rb,h,mat,x,y,z,par) => mesh(new THREE.CylinderGeometry(rt,rb,h,18), mat, x,y,z, par);
const clr = g => { for(const c of [...g.children]){ g.remove(c); if(c.geometry) c.geometry.dispose(); } };

/* 옷 5종: 0 셔츠+바지 · 1 블라우스+무릎치마 · 2 스웨트셔츠+바지 · 3 패딩+바지 · 4 반팔+반바지 */
function buildOutfit(e, o){
  const tg = e.torsoG, T = e.topM, TD = e.topDarkM, B = e.botM, armC = e.armC, legC = e.legC, shinC = e.shinC;
  [tg, armC.L, armC.R, legC.L, legC.R, shinC.L, shinC.R].forEach(clr);
  const pants = () => { cyl(.3,.3,.18,B,0,.69,0,tg); for(const k of 'LR'){ cyl(.108,.098,.3,B,0,-.15,0,legC[k]); cyl(.098,.09,.3,B,0,-.15,0,shinC[k]); } };
  const sleeves = (rt,rb,cuff) => { for(const k of 'LR'){ cyl(rt,rb,.5,T,0,-.25,0,armC[k]); if(cuff) cyl(rt+.006,rt+.006,.05,cuff,0,-.47,0,armC[k]); } };
  const socks = () => { for(const k of 'LR') cyl(.096,.09,.12,whiteM,0,-.24,0,shinC[k]); };
  if(o === 0){                                           // 셔츠 + 바지
    cyl(.27,.3,.51,T,0,.995,0,tg); pants(); sleeves(.085,.08,TD);
    for(const sx of [-1,1]){ const c = mesh(new THREE.BoxGeometry(.15,.05,.09), whiteM, sx*.09,1.07,.25, tg); c.rotation.set(-.3,0,sx*.7); }   // 옷깃
    for(const y of [.85,.97]) sph(.02,whiteM,0,y,.3,tg);                                                                                      // 단추

      leave: () => D.remove(mine),

function merge(id, d){
  if(id === me.id) return;
  const p = players[id] || {rx:d.x, rz:d.z, rr:d.r};
  Object.assign(p, d, {seen:Date.now()}); players[id] = p;
}
// Firebase는 같은 값을 다시 써도 다른 사람에게 알림이 가지 않아서, 가만히 있는 사람이 '오래됨'으로 사라졌음.
// Firebase 모드에서는 시간으로 거르지 않고, 접속이 끊기면 서버가 지워 주는(onDisconnect) 것만 믿음.
let useStale = true;
const fresh = () => Object.entries(players).filter(([,p]) => !useStale || Date.now()-p.seen < STALE);

/* ---------- 채팅 ---------- */
const chatLog = $('chatLog'), chatIn = $('chatIn');
let chatLive = false, lastChatAt = 0;
function sysChat(text){
  const row = document.createElement('div'); row.className = 'sys'; row.textContent = '⚠ '+text;
  chatLog.appendChild(row); chatLog.scrollTop = chatLog.scrollHeight;
}
function addChat(m){
  if(!m || typeof m.text !== 'string' || !m.text) return;
  const row = document.createElement('div'), who = document.createElement('span');
  who.className = 'who'; who.textContent = m.name || '?';
  row.append(who, document.createTextNode(m.text));
  if(m.id === me.id) row.className = 'mine';
  const atBottom = chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 30;
  chatLog.appendChild(row); while(chatLog.children.length > 50) chatLog.firstChild.remove();
  if(atBottom || m.id === me.id) chatLog.scrollTop = chatLog.scrollHeight;
  if(chatLive){ const e = ents[m.id]; if(e){ e.cb.textContent = m.text; e.cbUntil = performance.now() + 5000; e.cbOn = null; } }   // 입장 전 기록은 말풍선 없이 목록에만
}
function sendChat(){
  const v = chatIn.value.trim().slice(0,60), now = performance.now();
  if(!joined) return;
  if(!v){ chatIn.blur(); return; }                         // 빈 칸에서 Enter → 채팅창 빠져나오기
  if(now - lastChatAt < 500) return;
  lastChatAt = now; chatIn.value = ''; net.chat({id:me.id, name:me.name, text:v});
}
chatIn.addEventListener('keydown', e => { if(e.isComposing) return; if(e.key === 'Enter'){ e.preventDefault(); sendChat(); } if(e.key === 'Escape') chatIn.blur(); });

let lastSent = '', lastT = 0;
function broadcast(force){
  const d = {name:me.name, x:+me.x.toFixed(2), z:+me.z.toFixed(2), r:+me.r.toFixed(2), seat:me.seat, lunch:me.lunch, msg:me.msg, color:me.color, bot:me.bot, hcol:me.hcol, outfit:me.outfit, hair:me.hair, scr:me.scr, hit:me.hit};
  const s = JSON.stringify(d), now = Date.now();
  if(!force && ((s === lastSent && now-lastT < 5000) || now-lastT < 100)) return;
  lastSent = s; lastT = now; net.send(d);
}

/* ---------- 입장 ---------- */
const nickEl = $('nick'), errEl = $('err'), goBtn = $('go');
try{ nickEl.value = localStorage.getItem('nick') || ''; }catch(e){}
async function enter(){
  audio();
  const name = nickEl.value.trim();
  if(!name){ errEl.textContent = '닉네임을 입력해 주세요.'; return; }
  goBtn.disabled = true; errEl.textContent = '접속 중…';
  try{
    net = await initNet();
    await new Promise(r => setTimeout(r, 900));
    if(fresh().length >= MAX){ errEl.textContent = '지금은 사무실이 가득 찼어요. 잠시 후 다시 시도해 주세요.'; goBtn.disabled = false; return; }
  }catch(e){ errEl.textContent = '연결에 실패했어요. 설정을 확인해 주세요.'; goBtn.disabled = false; console.error(e); return; }
  me.name = name; const l0 = look(me.id, {}); me.outfit = l0.outfit; me.hair = l0.hair;
  try{
    localStorage.setItem('nick', name);
    const sv = JSON.parse(localStorage.getItem('look') || 'null');
    if(sv){ const l1 = look(me.id, sv); me.outfit = l1.outfit; me.hair = l1.hair; for(const k of ['color','bot','hcol']) me[k] = HEX.test(sv[k]||'') ? sv[k] : ''; }
    else { const c = localStorage.getItem('color'); if(HEX.test(c||'')) me.color = c; }
  }catch(e){}
  joined = true; chatLive = true; $('join').style.display = 'none'; $('chat').hidden = false; msgIn.value = me.msg; broadcast(true);
}
goBtn.onclick = enter;
nickEl.addEventListener('keydown', e => { if(e.key === 'Enter') enter(); });
addEventListener('beforeunload', () => net && net.leave());

/* ---------- 입력·버튼 ---------- */
const MOVE = ['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'];
// 한글 입력 상태(ㅈㅁㄴㅇ·ㄹ)에서도 동작하도록 글자가 아닌 '키 위치(code)'로 판별
const CODE = {KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',KeyF:'f',Space:' ',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright'};
const kname = e => CODE[e.code] || e.key.toLowerCase();
addEventListener('keydown', e => {
  if(!joined || e.target.tagName === 'INPUT') return;
  if(e.key === 'Enter'){ e.preventDefault(); chatIn.focus(); return; }
  const k = kname(e);
  if(k === ' '){ e.preventDefault(); toggleSit(); return; }
  if(k === 'f'){ punch(); return; }
  if(MOVE.includes(k)){ e.preventDefault(); keys[k] = true; target = null; if(me.seat >= 0) standUp(); }
});
addEventListener('keyup', e => { delete keys[kname(e)]; });
document.addEventListener('click', e => { const b = e.target.closest('button'); if(b && b !== goBtn) b.blur(); });

const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0), hit = new THREE.Vector3();
// 화면을 드래그하면 시점 회전, 짧게 클릭하면 그 위치로 이동
const PITCH0 = Math.atan2(12,11);
let camYaw = 0, camPitch = PITCH0, drag = null;
const cvEl = $('c');
cvEl.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, moved:false}; cvEl.setPointerCapture(e.pointerId); closePanels(); });
cvEl.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 6) drag.moved = true;
  if(drag.moved){ camYaw -= (e.clientX-drag.lx)*.006; camPitch = Math.min(1.3, Math.max(.35, camPitch + (e.clientY-drag.ly)*.004)); }
  drag.lx = e.clientX; drag.ly = e.clientY;
});
cvEl.addEventListener('pointerup', e => {
  if(drag && !drag.moved && joined){
    ray.setFromCamera({x:e.clientX/innerWidth*2-1, y:-(e.clientY/innerHeight)*2+1}, camera);
    if(ray.ray.intersectPlane(plane, hit)){ target = {x:hit.x, z:hit.z}; if(me.seat >= 0) standUp(); }
  }
  drag = null;
});
cvEl.addEventListener('pointercancel', () => { drag = null; });
$('viewBtn').onclick = () => { camYaw = 0; camPitch = PITCH0; };
const lp = $('lunchPanel'), msgIn = $('msgIn');
const sp = $('stylePanel'), nameIn = $('nameIn');
function closePanels(){ lp.hidden = sp.hidden = true; }
function openPanel(p){ const open = p.hidden; closePanels(); p.hidden = !open; if(!p.hidden && p === sp) syncStyle(); }
$('sit').onclick = () => joined && toggleSit();
$('lunchBtn').onclick = () => joined && openPanel(lp);
$('styleBtn').onclick = () => joined && openPanel(sp);
// 꾸미기: 옷 5종 · 머리 4종 · 상의/하의/머리 색
const OUTFITS = ['셔츠·바지','블라우스·치마','스웨트셔츠·바지','패딩·바지','반팔·반바지'], HAIRS = ['긴머리','중간머리','단발머리','남자머리'];
function saveLook(){ try{ localStorage.setItem('look', JSON.stringify({outfit:me.outfit, hair:me.hair, color:me.color, bot:me.bot, hcol:me.hcol})); }catch(e){} }
function chips(el, names, key){
  names.forEach((n,i) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = n;
    b.onclick = () => { me[key] = i; saveLook(); syncStyle(); }; el.appendChild(b); });
}
chips($('outfitGroup'), OUTFITS, 'outfit'); chips($('hairGroup'), HAIRS, 'hair');
const HAIR_SW = ['#222222','#3a2d25','#7a4b2a','#b58a5d','#e0bf6a','#c0504d','#e98bb0','#8fa3c8'];
HAIR_SW.forEach(c => { const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.dataset.c = c; b.setAttribute('aria-label','머리색 '+c);
  b.onclick = () => { me.hcol = c; saveLook(); syncStyle(); }; $('hairSw').appendChild(b); });
const COLS = [['color','topIn','topHue'],['bot','botIn','botHue'],['hcol','hairIn','hairHue']];
const hueOf = hex => { const o = {}; new THREE.Color(hex).getHSL(o); return Math.round(o.h*360); };
function syncStyle(){
  nameIn.value = me.name;
  const l = look(me.id, me), cur = {color:l.top, bot:l.bot, hcol:l.hcol};
  COLS.forEach(([k,ci,hi]) => { $(ci).value = cur[k]; $(hi).value = hueOf(cur[k]); });
  [...$('outfitGroup').children].forEach((b,i) => b.classList.toggle('on', i === l.outfit));
  [...$('hairGroup').children].forEach((b,i) => b.classList.toggle('on', i === l.hair));
  [...$('hairSw').children].forEach(b => b.classList.toggle('on', b.dataset.c.toLowerCase() === l.hcol.toLowerCase()));
}
COLS.forEach(([k,ci,hi]) => {
  $(ci).addEventListener('input', () => { me[k] = $(ci).value; $(hi).value = hueOf(me[k]); saveLook(); });
  $(hi).addEventListener('input', () => { const c = '#'+new THREE.Color().setHSL($(hi).value/360,.75,.5).getHexString(); $(ci).value = c; me[k] = c; saveLook(); });
});
$('lookReset').onclick = () => { const l = look(me.id, {}); me.color = me.bot = me.hcol = ''; me.outfit = l.outfit; me.hair = l.hair; saveLook(); syncStyle(); };
function rename(){ const n = nameIn.value.trim().slice(0,8); if(!n) return; me.name = n; try{ localStorage.setItem('nick', n); }catch(e){} broadcast(true); closePanels(); }
$('nameOk').onclick = rename;
nameIn.addEventListener('keydown', e => { if(e.key === 'Enter') rename(); if(e.key === 'Escape') closePanels(); });
const hitBtn = $('hitBtn'); let lastHitAt = 0;
const nearDino = () => Math.hypot(me.x-DINO.x, me.z-DINO.z) < 3.8;
function punch(){
  const now = performance.now();
  if(!joined || me.seat >= 0 || !nearDino() || now-lastHitAt < 350) return;
  lastHitAt = now; me.r = Math.atan2(DINO.x-me.x, DINO.z-me.z); target = null;
  me.hit++; me.punchT = now/1000; broadcast(true); dinoHit();
}
hitBtn.onclick = punch;
$('muteBtn').onclick = e => { muted = !muted; if(master) master.gain.value = muted ? 0 : 1; e.currentTarget.textContent = muted ? '🔇' : '🔊'; };
lp.querySelectorAll('button').forEach(b => b.onclick = () => { me.lunch = b.dataset.lunch; broadcast(true); closePanels(); });
function setMsg(v){ if(!joined) return; me.msg = v.trim().slice(0,24); msgIn.value = me.msg; broadcast(true); msgIn.blur(); }   // 적용 후 입력칸에서 빠져나와 바로 이동 가능
$('msgOk').onclick = () => setMsg(msgIn.value);
$('msgClear').onclick = () => setMsg('');
msgIn.addEventListener('keydown', e => { if(e.isComposing) return; if(e.key === 'Enter') setMsg(msgIn.value); if(e.key === 'Escape'){ msgIn.value = me.msg; msgIn.blur(); } });

const taken = i => fresh().some(([,p]) => p.seat === i);
function standUp(){ if(me.seat >= 6){ me.x = BEDS[me.seat-6].x; me.z = 5.4; me.seat = -1; return; } const s = SEATS[me.seat]; me.x = s.x >= 6 ? s.x-3 : s.x+3; me.z = s.z; me.seat = -1; }
function toggleSit(){
  if(me.seat >= 0){ standUp(); return; }
  let best = -1, bd = 2.2;
  SEATS.forEach((s,i) => { const d = Math.hypot(s.x-me.x, s.z-me.z); if(d < bd && !taken(i)){ bd = d; best = i; } });
  if(best >= 0){ me.seat = best; me.x = SEATS[best].x; me.z = SEATS[best].z; me.r = SEATS[best].r; target = null; me.scr = Math.floor(Math.random()*SCREEN_MSGS.length); }
  else {                                                   // 의자가 아니면 가까운 침대에 눕기
    let bb = -1, bdd = 3.4;
    BEDS.forEach((b,i) => { const d = Math.hypot(b.x-me.x, 8-me.z); if(d < bdd && !taken(6+i)){ bdd = d; bb = i; } });
    if(bb >= 0){ me.seat = 6+bb; me.x = BEDS[bb].x; me.z = BED_Z0; me.r = Math.PI; target = null; }
  }
}

/* ---------- 루프 ---------- */
const lerpAng = (a,b,t) => a + ((((b-a+Math.PI)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)-Math.PI)*t;
let prev = performance.now(), meMoving = false;
function frame(now){
  const dt = Math.min(.05,(now-prev)/1000), t = now/1000; prev = now;
  meMoving = false;
  if(joined && me.seat < 0){
    const kx = (keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
    const kz = (keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
    let dx = 0, dz = 0;
    if(kx || kz){ const sn = Math.sin(camYaw), cs = Math.cos(camYaw), fw = -kz; dx = cs*kx - sn*fw; dz = -sn*kx - cs*fw; }   // 화면 기준 위/아래/좌/우
    if(!dx && !dz && target){
      const tx = target.x-me.x, tz = target.z-me.z, d = Math.hypot(tx,tz);
      if(d < .15) target = null; else { dx = tx/d; dz = tz/d; }
    }
    if(dx || dz){
      const l = Math.hypot(dx,dz), ox = me.x, oz = me.z;
      const nx = Math.min(11.5, Math.max(-11.5, me.x + dx/l*5*dt));
      const nz = Math.min(9.4, Math.max(-7, me.z + dz/l*5*dt));
      if(!blocked(nx, me.z)) me.x = nx;
      if(!blocked(me.x, nz)) me.z = nz;
      meMoving = Math.hypot(me.x-ox, me.z-oz) > 1e-4;
      if(!meMoving) target = null;
      me.r = lerpAng(me.r, Math.atan2(dx,dz), Math.min(1,dt*14));
    }
  }
  for(const id in ents) ents[id].seen = false;
  for(const [id,p] of fresh()){
    const k = Math.min(1,dt*12), mv = Math.hypot(p.x-p.rx, p.z-p.rz) > .03;
    p.rx += (p.x-p.rx)*k; p.rz += (p.z-p.rz)*k; p.rr = lerpAng(p.rr, p.r, k);
    show(id, false, p, p.rx, p.rz, p.rr, mv, t);
  }
  if(joined){ show(me.id, true, me, me.x, me.z, me.r, meMoving, t); broadcast(); }
  for(const id in ents) if(!ents[id].seen){ stopTyping(ents[id].typing); scene.remove(ents[id].g); ents[id].tag.remove(); delete ents[id]; }
  const scr = SEATS.map(() => -1);
  for(const [,p] of fresh()) if(p.seat >= 0 && p.seat < SEATS.length) scr[p.seat] = Number.isInteger(p.scr) ? p.scr : 0;
  if(joined && me.seat >= 0) scr[me.seat] = me.scr;
  screens.forEach((sc,i) => {
    if(sc.state !== scr[i]){ sc.state = scr[i]; drawScreen(i, scr[i]); sc.fade = scr[i] >= 0 ? 0 : 1; sc.mat.color.setScalar(sc.fade); }
    if(sc.fade < 1){ sc.fade = Math.min(1, sc.fade + dt/.4); sc.mat.color.setScalar(sc.fade); }   // 켜질 때 서서히 밝아짐
  });
  const bedOcc = [false,false,false];
  for(const [,p] of fresh()) if(p.seat >= 6 && p.seat <= 8) bedOcc[p.seat-6] = true;
  if(joined && me.seat >= 6) bedOcc[me.seat-6] = true;
  ivs.forEach((iv,i) => {                                  // 누우면 링거가 스르륵 나타남
    iv.k = Math.min(1, Math.max(0, iv.k + (bedOcc[i] ? 1 : -1)*dt/.35));
    iv.g.visible = iv.k > 0; iv.g.scale.setScalar(Math.max(.01, iv.k));
    iv.drop.position.y = 2.4 - ((t*1.2)%1)*.22;
  });
  placeAt(restTag, 0, 3.6, 9.6); if(!wallF.visible) restTag.style.display = 'none';
  dinoW *= Math.exp(-dt*4);
  dino.rotation.z = Math.sin(t*28)*.07*dinoW;
  dino.scale.set(1+dinoW*.04, 1-dinoW*.06+Math.sin(t*2)*.004, 1);
  placeAt(dinoTag, DINO.x, 5.5, DINO.z);
  const near = joined && me.seat < 0 && nearDino();
  if(hitBtn.hidden === near) hitBtn.hidden = !near;
  const fx = joined ? me.x*.7 : 0, fz = joined ? me.z : 2;
  camX += (fx-camX)*Math.min(1,dt*4); camZ += (fz-camZ)*Math.min(1,dt*4);
  const D = 16.3, ce = Math.cos(camPitch), sy = Math.sin(camYaw), cy = Math.cos(camYaw);
  camera.position.set(camX + sy*ce*D, Math.sin(camPitch)*D, camZ + cy*ce*D);
  camera.lookAt(camX - sy, 0, camZ - cy);
  wallsBack.forEach(m => m.visible = camera.position.z > -7.6);          // 벽 바깥으로 돌면 그 벽은 숨김
  wallL.visible = camera.position.x > -12.6; wallR.visible = camera.position.x < 12.6; wallF.visible = camera.position.z < 9.8;
  $('count').textContent = `접속 ${fresh().length+(joined?1:0)} / ${MAX}명`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
