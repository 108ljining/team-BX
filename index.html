<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 사무실 3D</title>
<style>
:root{--bg:#2b2d2a;--ink:#f2efe6;--panel:#3a3d38;--accent:#6fa37f;--warn:#e0a64a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;text-align:center;font-size:12px;font-weight:700}
.tag .bubble{display:none;background:rgba(58,61,56,.92);color:#f2efe6;border:1px solid #6b7064;border-radius:8px;padding:2px 8px;margin:0 auto 3px;width:max-content;max-width:160px;font-size:11px;font-weight:600}
.tag .chat{display:none;position:relative;background:#fff;color:#1d1f1b;border-radius:12px;padding:5px 10px;margin:0 auto 9px;width:max-content;max-width:180px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:pop .18s ease-out}
.tag .chat::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#chat{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px}
#chatLog{max-height:170px;overflow-y:auto;background:rgba(43,45,42,.8);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;word-break:break-all}
#chatLog:empty{display:none}
#chatLog .who{font-weight:700;color:#cfe3cf;margin-right:6px}
#chatLog .mine .who{color:#f2d98a}
#chatIn{width:100%;background:rgba(43,45,42,.92)}
@media(max-width:900px){#chat{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}#chatLog{max-height:110px}}
.tag .lc{display:none;background:#cfe3cf;color:#1d1f1b;border-radius:10px;padding:2px 8px;margin:0 auto 3px;width:max-content}
.tag .nm{background:#f2efe6;color:#1d1f1b;border-radius:10px;padding:2px 8px;margin:0 auto;width:max-content}
.tag.me .nm{background:#f2d98a}
#ui{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100% - 20px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:rgba(43,45,42,.9);padding:8px 12px;border-radius:12px;font-size:14px}
#hint{font-size:12px;opacity:.65}
#msgIn{width:min(240px,46vw)}
#icoBtn{font-size:20px;padding:4px 8px;line-height:1.2}
#emojiPanel{flex-direction:column;align-items:stretch;gap:8px;width:min(520px,calc(100vw - 24px))}
#emojiTabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#emojiTabs button{padding:4px 8px;font-size:18px}
#emojiTabs button.on{border-color:var(--accent);background:#4a5a4d}
#emojiGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:2px;max-height:min(30vh,220px);overflow-y:auto}
#emojiGrid button{font-size:22px;padding:4px 0;border:0;background:transparent;border-radius:6px}
#emojiGrid button:hover{background:#4a4f47}
#emojiOwn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12px;opacity:.85}
#emojiIn{width:70px;font-size:18px;text-align:center}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid #55594f;border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #55594f;background:#2b2d2a;color:var(--ink)}
#join{position:fixed;inset:0;background:rgba(30,32,28,.94);display:flex;align-items:center;justify-content:center;padding:20px}
#join div{background:var(--panel);padding:28px;border-radius:12px;width:min(360px,100%)}
#join h1{font-size:20px;margin:0 0 6px}
#join p{margin:0 0 16px;font-size:14px;opacity:.75}
#join input{width:100%;margin-bottom:12px;padding:10px}
#join button{width:100%;background:var(--accent);color:#17231b;border:0;font-weight:700}
#err{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}
input[type=color]{width:44px;height:36px;padding:2px;cursor:pointer}
.hue{-webkit-appearance:none;appearance:none;width:110px;height:14px;padding:0;border:0;border-radius:7px;background:linear-gradient(90deg,hsl(0 75% 50%),hsl(60 75% 50%),hsl(120 75% 50%),hsl(180 75% 50%),hsl(240 75% 50%),hsl(300 75% 50%),hsl(360 75% 50%))}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #333;cursor:pointer}
.hue::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #333;cursor:pointer}
#stylePanel{flex-direction:column;align-items:stretch;gap:10px;width:min(640px,calc(100vw - 24px));max-height:min(62vh,440px);overflow-y:auto}
.pair{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:10px;background:rgba(255,255,255,.04)}
.sw{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid #55594f}
.sw.on{border-color:#f2efe6}
#chatLog .sys{color:var(--warn);font-size:12px}
.grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.lbl{font-size:12px;opacity:.75;min-width:30px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{padding:6px 10px;font-size:13px}
.chip.on{border-color:var(--accent);background:#4a5a4d}
.pow{position:fixed;left:0;top:0;pointer-events:none;font-weight:900;font-size:28px;color:#ffd84a;-webkit-text-stroke:1px #7a3b00;text-shadow:0 2px 0 #7a3b00;animation:pow .7s ease-out forwards}
@keyframes pow{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-220%) scale(1.5)}}
@media(max-width:600px){#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="ui">
  <div class="row" id="emojiPanel" hidden>
    <div id="emojiTabs"></div>
    <div id="emojiGrid"></div>
    <div id="emojiOwn"><span>목록에 없으면 직접 입력</span><input id="emojiIn" maxlength="16" placeholder="😀" autocomplete="off"><button id="emojiOk">적용</button><span>(Windows: Win + . / Mac: Ctrl + Cmd + Space)</span></div>
  </div>
  <div class="row" id="photoPanel" hidden>
    <span class="lbl">액자</span><span class="chips" id="slotGroup"></span>
    <button id="photoPick">📷 사진 고르기</button>
    <button id="photoDel">비우기</button>
    <input type="file" id="photoFile" accept="image/*" hidden>
    <span class="lbl" id="photoMsg">왼쪽 벽 액자에 붙어요</span>
  </div>
  <div class="row" id="lunchPanel" hidden>
    <button data-lunch="안에서 🍱">안에서 🍱</button>
    <button data-lunch="밖에서 🍜">밖에서 🍜</button>
    <button data-lunch="">선택 지우기</button>
  </div>
  <div class="row" id="stylePanel" hidden>
    <div class="sec">
      <div class="grp"><span class="lbl">옷</span><span class="chips" id="outfitGroup"></span></div>
      <div class="grp">
        <span class="pair"><span class="lbl">상의</span><input type="color" id="topIn" aria-label="상의 색"><input type="range" class="hue" id="topHue" min="0" max="360" aria-label="상의 색상 스펙트럼"></span>
        <span class="pair"><span class="lbl">하의</span><input type="color" id="botIn" aria-label="하의 색"><input type="range" class="hue" id="botHue" min="0" max="360" aria-label="하의 색상 스펙트럼"></span>
      </div>
    </div>
    <div class="sec">
      <div class="grp"><span class="lbl">머리</span><span class="chips" id="hairGroup"></span></div>
      <div class="grp"><span class="pair"><span class="lbl">머리색</span><input type="color" id="hairIn" aria-label="머리 색"><input type="range" class="hue" id="hairHue" min="0" max="360" aria-label="머리 색상 스펙트럼"></span><span class="chips" id="hairSw"></span></div>
    </div>
    <div class="grp"><input id="nameIn" maxlength="8" placeholder="닉네임 (8자)" autocomplete="off" size="9"><button id="nameOk">이름 바꾸기</button><button id="lookReset">기본값</button></div>
  </div>
  <div class="row" id="msgRow">
    <button id="icoBtn" title="상태 아이콘 고르기" aria-label="상태 아이콘 고르기">📌</button>
    <input id="msgIn" maxlength="24" placeholder="상태메세지 (계속 표시, 24자)" autocomplete="off" size="24">
    <button id="msgOk">설정</button>
    <button id="msgClear">지우기</button>
  </div>
  <div class="row">
    <button id="sit">앉기·눕기 / 일어나기</button>
    <button id="lunchBtn">점심</button>
    <button id="styleBtn">꾸미기</button>
    <button id="photoBtn">🖼 사진</button>
    <button id="viewBtn" title="시점 처음으로" aria-label="시점 초기화">🎥</button>
    <button id="muteBtn" title="효과음 켜기/끄기" aria-label="효과음">🔊</button>
    <button id="hitBtn" hidden>🥊 때리기 (F)</button>
    <button id="paperBtn" hidden>🧻 종이 던지기 (T)</button>
    <button id="kickBtn" hidden>🦶 화분 차기 (F)</button>
    <button id="winBtn" hidden>🪟 창문 탈출 (Space)</button>
    <button id="flipBtn" hidden>🙃 책상 엎기 (G)</button>
    <span id="count"></span>
    <span id="hint">방향키·WASD 이동 · 바닥 클릭 이동 · Space 점프·앉기·눕기 · 공룡 앞 F · 화분 옆 F · 사진 쪽에서 T · 창문 앞 Space · 책상 옆 G · Enter 채팅 · 드래그로 시점 회전</span>
  </div>
</div>
<div id="chat" hidden>
  <div id="chatLog" aria-live="polite"></div>
  <input id="chatIn" maxlength="60" placeholder="💬 채팅 입력 후 Enter" autocomplete="off">
</div>
<div id="join"><div>
  <h1>우리 사무실</h1>
  <p>닉네임을 정하고 들어오세요. (최대 12명)</p>
  <input id="nick" maxlength="8" placeholder="닉네임 (8자 이내)" autocomplete="off">
  <button id="go">입장</button>
  <div id="err"></div>
</div></div>

<script src="firebase-config.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ====== Firebase Realtime Database 정보를 넣으면 다른 기기와도 동시접속됩니다.
   설정은 firebase-config.js 파일에 넣습니다. 비워 두면 같은 브라우저의 다른 탭끼리만 테스트용으로 연결됩니다. ====== */
const _c = window.FIREBASE_CONFIG;
const FIREBASE_CONFIG = (_c && _c.databaseURL && !String(_c.databaseURL).includes('여기에')) ? _c : null;
const MAX = 12, STALE = 15000;
const $ = id => document.getElementById(id);

/* ---------- 3D 장면 ---------- */
const renderer = new THREE.WebGLRenderer({canvas:$('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2d2a);
const camera = new THREE.PerspectiveCamera(42, 1, .1, 100);
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8a8678, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(6, 14, 8); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera, {left:-24, right:24, top:24, bottom:-24, near:1, far:60}); sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const M = (c, o={}) => new THREE.MeshStandardMaterial({color:c, roughness:.85, ...o});
function box(w,h,d,mat,x,y,z,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30,26.2), M(0xd0cbba));   // 넓힌 사무실: x ±15, z -8 ~ 18.2
floor.rotation.x = -Math.PI/2; floor.position.z = 5.1; floor.receiveShadow = true; scene.add(floor);
const wallM = M(0xe8e4d6);
const wallsBack = [box(30,5,.4,wallM,0,2.5,-8)], wallL = box(.4,5,26.6,wallM,-15,2.5,5.1), wallR = box(.4,5,26.6,wallM,15,2.5,5.1), wallF = box(30,5,.4,wallM,0,2.5,18.2);
wallF.castShadow = false;
wallsBack.push(box(30,.25,.45,M(0xb9b5a3),0,.12,-7.8));
const glassM = M(0xa8d0e4,{emissive:0x5a8aa0,emissiveIntensity:.5});
const WINS = [-6,6].map(x => { const pane = box(4,2,.1,glassM,x,3,-7.78); wallsBack.push(pane); return {x, pane, hole:null, broken:false, t0:0}; });
const OZ = 7;                                 // 사무공간을 맵 가운데로 옮기는 값
const SP = 1;                                 // 앞뒤 책상 줄 사이를 양쪽으로 벌리는 값 (의자 사이 통로 넓게)
box(21,.03,5.2+SP*2,M(0x8fa89a),0,.015,-3+OZ);  // 책상 구역 러그

/* 책상 8개: 4개 + 4개, 의자 등을 맞대고 앉음 */
/* 모니터 화면: 앉으면 켜지며 흰 바탕에 랜덤 문구 */
const SCREEN_MSGS = ['집갈래','졸려','일하기싫어'];
const screens = [];
function makeScreen(i, x, z, flip, parent=scene){
  const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 150;
  const tex = new THREE.CanvasTexture(canvas), mat = new THREE.MeshBasicMaterial({map:tex});
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.05,.6), mat);
  m.position.set(x,1.95,z); if(flip) m.rotation.y = Math.PI; parent.add(m);
  screens[i] = {canvas, tex, mat, state:-1, fade:1}; drawScreen(i,-1);
}
function drawScreen(i, idx){
  const sc = screens[i], c = sc.canvas.getContext('2d'), w = 256, h = 150;
  if(idx < 0){ c.fillStyle = '#1c2227'; c.fillRect(0,0,w,h); }
  else {
    c.fillStyle = '#fff'; c.fillRect(0,0,w,h); c.fillStyle = '#e4e6e8'; c.fillRect(0,0,w,20);
    ['#ff6b5f','#ffc04a','#3fcf5a'].forEach((col,k) => { c.fillStyle = col; c.beginPath(); c.arc(14+k*16,10,5,0,7); c.fill(); });
    c.fillStyle = '#222'; c.font = 'bold 42px "Noto Sans KR", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(SCREEN_MSGS[idx % SCREEN_MSGS.length], w/2, 86);
  }
  sc.tex.needsUpdate = true;
}
const SEATS = [];
for(const x of [-9,-3,3,9]){ SEATS.push({x, z:-3.8-SP+OZ, r:Math.PI}); SEATS.push({x, z:-2.2+SP+OZ, r:0}); }
const DESKS = [], DESK_G = [], BED0 = SEATS.length;   // 자리 번호: 책상 0~7, 침대 8~12
const wood = M(0xb58a5d), dark = M(0x3d4a52), gray = M(0x59635f);
SEATS.forEach((s,si) => {
  const f = s.r === 0, Z = z => (f ? -6 - z + SP : z - SP) + OZ;   // 반대편 줄은 z=-3 기준 대칭, SP만큼 벌림
  const zc = Z(-5.2), L = z => Z(z) - zc;                      // 책상·모니터는 한 덩어리로 묶어서 통째로 엎을 수 있게
  const pivot = new THREE.Group(); pivot.position.set(s.x,0,zc); scene.add(pivot);
  const dk = new THREE.Group(); pivot.add(dk);
  box(3,.15,1.6,wood,0,1.2,0,dk); box(.12,1.2,1.4,wood,-1.4,.6,0,dk); box(.12,1.2,1.4,wood,1.4,.6,0,dk);
  box(1.2,.75,.07,dark,0,1.95,L(-5.45),dk); makeScreen(si, 0, L(-5.45) + (f ? -.045 : .045), f, dk); box(.15,.35,.15,gray,0,1.4,L(-5.4),dk); box(.9,.05,.3,gray,0,1.3,L(-4.8),dk);
  DESK_G[si] = {pivot, dk, x:s.x, zc, state:0, t0:0, sgn:1, landed:false};
  const bd = f ? -1 : 1;                                              // 의자 등받이 쪽 (책상 반대쪽)
  const chair = new THREE.Group(); chair.position.set(s.x,0,s.z + bd*.45); scene.add(chair);   // 등받이 아래 모서리를 축으로 뒤로 넘어감
  box(.9,.12,.9,gray,0,.7,-bd*.45,chair); box(.9,.9,.1,gray,0,1.25,0,chair);
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.65), gray); p.position.set(0,.35,-bd*.45); chair.add(p);
  DESK_G[si].chair = chair; DESK_G[si].cbd = bd;
  DESKS.push({x1:s.x-1.5, x2:s.x+1.5, z1:zc-.8, z2:zc+.8});
});
/* 사진 액자 4개 (왼쪽 벽): 누구나 사진을 붙이면 모두에게 보임 */
const PHOTO_Z = [-2.5,1.7,5.9,10.1], frames = [], frameM = M(0x6b4f36);
function drawEmptyPhoto(i){
  const f = frames[i], g = f.c.getContext('2d');
  g.fillStyle = '#ece6d6'; g.fillRect(0,0,480,360);
  g.strokeStyle = '#b9b09a'; g.lineWidth = 4; g.setLineDash([14,10]); g.strokeRect(24,24,432,312); g.setLineDash([]);
  g.fillStyle = '#8a8270'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 40px "Noto Sans KR", sans-serif'; g.fillText('+ 사진', 240, 165);
  g.font = '24px "Noto Sans KR", sans-serif'; g.fillText('액자 '+(i+1), 240, 215);
  f.tex.needsUpdate = true;
}
PHOTO_Z.forEach((z,i) => {
  const border = box(.08,1.85,2.4,frameM,-14.77,2.7,z);
  const c = document.createElement('canvas'); c.width = 480; c.height = 360;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.65), new THREE.MeshBasicMaterial({map:tex}));
  pic.position.set(-14.72,2.7,z); pic.rotation.y = Math.PI/2; scene.add(pic);
  frames[i] = {border, pic, c, tex, cur:null}; drawEmptyPhoto(i);
});
function applyPhotos(v){
  frames.forEach((f,i) => {
    const d = v && v[i], img = d && typeof d.img === 'string' && d.img.startsWith('data:image/') ? d.img : null;
    if(f.cur === img) return; f.cur = img;
    if(!img){ drawEmptyPhoto(i); return; }
    const im = new Image();
    im.onload = () => { if(f.cur !== img) return; const g = f.c.getContext('2d'); g.drawImage(im,0,0,480,360);
      if(d.by){ g.font = 'bold 20px "Noto Sans KR", sans-serif'; const w = g.measureText(d.by).width + 20;
        g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(470-w,326,w,26); g.fillStyle = '#fff'; g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(d.by, 460, 340); }
      f.tex.needsUpdate = true; };
    im.src = img;
  });
}

/* 화분 4개: 차면 날아가서 굴러다니다가 5초 뒤 제자리에 다시 나타남 */
const POTS = [], potM = M(0x8a6a4f), leafM = M(0x4f8a5b);
for(const [x,z] of [[-14,-7],[14,-7],[-14,16.8],[14,16.8]]){
  const g = new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  mesh(new THREE.CylinderGeometry(.45,.35,.7,12), potM, 0,.35,0, g);
  mesh(new THREE.SphereGeometry(.8,12,10), leafM, 0,1.3,0, g);

/* ---------- 점프: 걸으면서 Space ---------- */
const HOP_DUR = .55;
function hop(){
  const t = performance.now()/1000;
  if(!joined || me.seat >= 0 || busy() || t - me.hopT < HOP_DUR) return;   // 착지한 뒤에 다음 점프
  me.hopT = t; me.hop++; hopSound(1); broadcast(true);
}
function hopSound(vol=1){
  const a = actx; if(!a || muted || !master) return; const now = a.currentTime;
  const o = a.createOscillator(), og = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(260, now); o.frequency.exponentialRampToValueAtTime(620, now+.12);
  og.gain.setValueAtTime(.18*vol, now); og.gain.exponentialRampToValueAtTime(.001, now+.16);
  o.connect(og).connect(master); o.start(now); o.stop(now+.18);
}
function hopFx(e, t){
  const ph = (t - (e.hopT ?? -9))/HOP_DUR;
  if(ph < 0 || ph > 1) return;
  const k = Math.sin(ph*Math.PI), L = e.limbs;
  e.g.position.y += 4*ph*(1-ph)*.95;                                    // 포물선으로 뛰어오름
  L.legL.rotation.x = L.legR.rotation.x = -k*.8; L.shinL.rotation.x = L.shinR.rotation.x = k*1.1;   // 다리 접기
  L.armL.rotation.x = L.armR.rotation.x = -k*2.4; L.armL.rotation.z = -k*.3; L.armR.rotation.z = k*.3; // 만세
}

/* ---------- 꽈당: 앉아 있던 책상이 엎어지면 의자와 함께 뒤로 넘어졌다가 일어남 ---------- */
const FALL_DUR = 2.6;
const falling = () => performance.now()/1000 - me.fallT < FALL_DUR;
const busy = () => me.jumpT != null || falling();
function knockDown(i){
  const s = SEATS[i], bd = Math.sign(s.z - DESK_G[i].zc);
  me.seat = -1; me.x = s.x; me.z = s.z + bd*.3; me.r = s.r; target = null;
  for(const k in keys) delete keys[k];
  me.fallT = performance.now()/1000; me.fall++; broadcast(true);
}
function fallFx(e, t){
  const ph = t - (e.fallT ?? -99);
  if(ph < 0 || ph > FALL_DUR) return false;
  if(!e.fellPop || e.fellPop !== e.fallT){ e.fellPop = e.fallT; setTimeout(() => { thudSound(.8); popAt('꽈당!', e.g.position.x, 2.2, e.g.position.z); }, 300); }
  let k = ph < .38 ? ph/.38 : ph > FALL_DUR-.5 ? (FALL_DUR-ph)/.5 : 1;
  k = k*k*(3-2*k);
  const L = e.limbs, rp = e.rig.position;
  e.rig.rotation.x = -Math.PI/2*k;                                      // 뒤로 벌러덩
  rp.y = .21*(1-k) + .34*k + (ph > .38 && ph < .62 ? Math.sin((ph-.38)/.24*Math.PI)*.12 : 0); rp.z = 0;   // 바닥에 한 번 튕김
  L.legL.rotation.x = L.legR.rotation.x = -Math.PI/2*(1-k) - .25*k; L.shinL.rotation.x = L.shinR.rotation.x = Math.PI/2*(1-k);
  L.armL.rotation.x = L.armR.rotation.x = -.4*k; L.armL.rotation.z = -1.2*k; L.armR.rotation.z = 1.2*k;   // 대자로 뻗음
  L.legL.rotation.z = -.25*k; L.legR.rotation.z = .25*k;
  return true;
}

/* ---------- 책상 엎기: 책상 옆에서 G → 반대쪽으로 쾅 넘어지고 6초 뒤 제자리 ---------- */
function flipDesk(i, sgn, vol=1){
  const d = DESK_G[i]; if(!d || d.state) return;
  if(joined && me.seat === i) knockDown(i);                             // 그 책상에 앉아 있던 사람은 바닥에 꽈당
  d.state = 1; d.sgn = sgn; d.t0 = performance.now()/1000; d.landed = false; d.vol = vol;
  d.pivot.position.z = d.zc + sgn*.8; d.dk.position.z = -sgn*.8;      // 넘어지는 쪽 모서리를 축으로
}
function updateDesks(t){
  DESK_G.forEach(d => {
    if(!d.state) return;
    const e = t - d.t0; let a;
    if(e < .42){ const p = e/.42; a = p*p; }
    else if(e < .7){ if(!d.landed){ d.landed = true; thudSound(d.vol); popAt('쾅!', d.x, 2.2, d.zc + d.sgn*1.6); } a = 1 - Math.sin((e-.42)/.28*Math.PI)*.07; }
    else if(e < 6.5) a = 1;
    else if(e < 7.3){ const p = (e-6.5)/.8; a = 1 - p*p*(3-2*p); }
    else { a = 0; d.state = 0; }
    d.pivot.rotation.x = d.sgn*a*1.62;
    d.chair.rotation.x = d.cbd*Math.min(1, a*1.15)*1.42;                  // 의자도 같이 뒤로 꽈당
  });
}
const seatUsed = i => taken(i) || me.seat === i;
function nearDesk(){
  let best = -1, bd = 1;
  DESK_G.forEach((d,i) => { const dx = Math.max(Math.abs(me.x-d.x)-1.5,0), dz = Math.max(Math.abs(me.z-d.zc)-.8,0), dd = Math.hypot(dx,dz);
    if(dd < bd && !d.state){ bd = dd; best = i; } });
  return best;
}
function flipNear(){
  if(!joined || busy() || me.seat >= BED0) return;
  let i, sgn;
  if(me.seat >= 0){                                                     // 앉아 있으면 내 책상을 벌떡 일어나며 엎음
    i = me.seat; if(DESK_G[i].state) return;
    sgn = SEATS[i].z < DESK_G[i].zc ? 1 : -1;                            // 앉은 채로 엎으면 나도 같이 꽈당
  } else {
    i = nearDesk(); if(i < 0) return;
    sgn = me.z < DESK_G[i].zc ? 1 : -1;                                 // 내 반대쪽으로 넘어감
  }
  me.flip++; me.fd = i*2 + (sgn > 0 ? 1 : 0); me.r = Math.atan2(DESK_G[i].x-me.x, DESK_G[i].zc-me.z); me.punchT = performance.now()/1000;
  flipDesk(i, sgn); broadcast(true);
}
function popAt(text, x, y, z){
  const d = document.createElement('div'); d.className = 'pow'; d.textContent = text;
  placeAt(d, x, y, z); labelsEl.appendChild(d); d.addEventListener('animationend', () => d.remove());
}
function noiseBuf(a, sec, pow){ const n = Math.floor(a.sampleRate*sec), b = a.createBuffer(1,n,a.sampleRate), d = b.getChannelData(0); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,pow); return b; }
function glassSound(vol=1){
  const a = actx; if(!a || muted || !master) return; const now = a.currentTime;
  const n = a.createBufferSource(); n.buffer = noiseBuf(a,.45,2.5);
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2600;
  const g = a.createGain(); g.gain.value = .8*vol; n.connect(f).connect(g).connect(master); n.start(now);
  for(let i=0;i<9;i++){                                                // 유리 조각 짤랑짤랑
    const o = a.createOscillator(), og = a.createGain(), at = now + .05 + Math.random()*.5;
    o.type = 'sine'; o.frequency.value = 2400 + Math.random()*4200;
    og.gain.setValueAtTime(.0001, now); og.gain.setValueAtTime(.12*vol, at); og.gain.exponentialRampToValueAtTime(.0001, at+.18);
    o.connect(og).connect(master); o.start(now); o.stop(at+.2);
  }
}
function thudSound(vol=1){
  const a = actx; if(!a || muted || !master) return; const now = a.currentTime;
  const o = a.createOscillator(), og = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(110, now); o.frequency.exponentialRampToValueAtTime(32, now+.3);
  og.gain.setValueAtTime(1*vol, now); og.gain.exponentialRampToValueAtTime(.001, now+.4);
  o.connect(og).connect(master); o.start(now); o.stop(now+.42);
  const n = a.createBufferSource(); n.buffer = noiseBuf(a,.3,3);
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
  const g = a.createGain(); g.gain.value = .9*vol; n.connect(f).connect(g).connect(master); n.start(now);

const players = {};

async function initNet(){
  if(FIREBASE_CONFIG){
    const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const {initializeApp} = await import(B+'firebase-app.js');
    const D = await import(B+'firebase-database.js');
    const db = D.getDatabase(initializeApp(FIREBASE_CONFIG));
    const mine = D.ref(db, 'players/'+me.id);
    D.onValue(D.ref(db,'players'), s => {
      const v = s.val() || {};
      for(const id in players) if(!v[id]) delete players[id];
      for(const id in v) merge(id, v[id]);
    });
    D.onDisconnect(mine).remove(); useStale = false;
    const chatRef = D.ref(db, 'chat');
    // 최근 10개만 보여 주고, 그보다 오래된 메시지는 서버에서 지움
    const recent = D.query(chatRef, D.limitToLast(CHAT_KEEP)), keys = [];
    const prune = () => {
      if(keys.length < CHAT_KEEP) return;
      D.get(D.query(chatRef, D.orderByKey(), D.endBefore(keys[0]))).then(snap => {
        const del = {}; snap.forEach(c => { del[c.key] = null; });
        if(Object.keys(del).length) return D.update(chatRef, del);
      }).catch(err => console.error(err));
    };
    D.onValue(D.ref(db, 'photos'), s => applyPhotos(s.val() || {}),
      err => { console.error(err); sysChat('사진을 불러올 수 없어요. Realtime Database 규칙을 다시 게시해 주세요.'); });
    D.onChildRemoved(recent, s => { const i = keys.indexOf(s.key); if(i >= 0) keys.splice(i,1); });
    D.onChildAdded(recent, s => { keys.push(s.key); keys.sort(); addChat(s.val()); },
      err => { console.error(err); sysChat('채팅을 불러올 수 없어요. Realtime Database 규칙을 게시했는지 확인해 주세요.'); });
    let warned = false;
    return {
      send: d => D.set(mine, d)
        .then(() => { if(warned){ warned = false; sysChat('✅ 다시 정상적으로 저장되고 있어요.'); } })
        .catch(err => { console.error(err); if(!warned){ warned = true; sysChat('내 정보가 저장되지 않아요. Realtime Database 규칙을 최신 파일로 게시한 뒤 새로고침해 주세요.'); } }),
      leave: () => D.remove(mine),
      chat: m => D.push(chatRef, {...m, t: D.serverTimestamp()}).then(prune).catch(err => { console.error(err); sysChat('채팅 전송 실패: Realtime Database 규칙을 다시 게시해 주세요.'); }),
      prune,
      photo: (slot, data) => D.set(D.ref(db, 'photos/'+slot), data ? {...data, t: D.serverTimestamp()} : null)
        .catch(err => { console.error(err); sysChat('사진 저장 실패: Realtime Database 규칙을 다시 게시해 주세요.'); })
    };
  }
  const ch = new BroadcastChannel('office-demo-3d');
  const local = {};
  ch.onmessage = e => { if(e.data.chat) return addChat(e.data.chat); if(e.data.photo){ local[e.data.photo.slot] = e.data.photo.data; return applyPhotos(local); } const {id, data} = e.data; if(data) merge(id, data); else delete players[id]; };
  return {send: d => ch.postMessage({id:me.id, data:d}), leave: () => ch.postMessage({id:me.id, data:null}), chat: m => { ch.postMessage({chat:m}); addChat(m); },
    photo: (slot, data) => { ch.postMessage({photo:{slot, data}}); local[slot] = data; applyPhotos(local); }};
}
function merge(id, d){
  if(id === me.id) return;
  const p = players[id] || {rx:d.x, rz:d.z, rr:d.r};
  if(Math.hypot((d.x||0)-p.rx, (d.z||0)-p.rz) > 6){ p.rx = d.x; p.rz = d.z; }   // 리스폰 같은 순간이동은 미끄러지지 않게

}

  updateGlass(dt, t, camera.position.z > -7.6);
  wallL.visible = camera.position.x > -14.6; frames.forEach(f => f.border.visible = f.pic.visible = wallL.visible); wallR.visible = camera.position.x < 14.6; wallF.visible = camera.position.z < 17.8;
  $('count').textContent = `접속 ${fresh().length+(joined?1:0)} / ${MAX}명`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
